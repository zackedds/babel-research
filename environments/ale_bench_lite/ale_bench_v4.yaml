template_vars:
  problem_id: "ahc039"
  problem_description: "Populate this field at run time with the selected AHC statement."
  initial_solution_public_scores:
    ahc008: 183454030
    ahc011: 21465951
    ahc015: 34954179
    ahc016: 690445496
    ahc024: 95782
    ahc025: 190687459
    ahc026: 462845
    ahc027: 450292454
    ahc039: 186256
    ahc046: 72434
  eval_script_command: "python3 /testbed/repo/public_eval_runner.py --problem-id {{problem_id}} --code-path path"
  final_submission_prefix: "/testbed/repo/final_submission"
  inject_modal_budget_metadata_to_all_tool_calls: false
  evaluate_timeout_seconds: 600
  post_success_evaluations_limit: 2
  planner_model_budget_usd: 0
  planner_gpu_minutes_budget: 0
  evaluation_success_trigger: '"overall_judge_result": "JudgeResult.ACCEPTED"'
  evaluate_command_template: |
    timeout {{evaluate_timeout_seconds}} {{host_python_executable}} - <<'PY'
    import json
    from pathlib import Path

    PROBLEM_ID = "{{problem_id}}"
    PREFIX = "{{final_submission_prefix_host}}"

    def infer_language(path: Path) -> str:
        ext = path.suffix.lower()
        if ext == ".py":
            return "python"
        if ext in {".cpp", ".cc", ".cxx"}:
            return "cpp23"
        if ext == ".rs":
            return "rust"
        raise ValueError(f"unsupported submission extension: {ext}")

    def resolve_submission(prefix: str) -> Path | None:
        prefix_path = Path(prefix)
        candidates = []
        if prefix_path.suffix.lower() in {".py", ".cpp", ".cc", ".cxx", ".rs"}:
            candidates.append(prefix_path)
        else:
            candidates.extend(
                [
                    Path(prefix + ".py"),
                    Path(prefix + ".cpp"),
                    Path(prefix + ".cc"),
                    Path(prefix + ".cxx"),
                    Path(prefix + ".rs"),
                ]
            )
            parent = prefix_path.parent
            if parent.exists():
                candidates.extend(sorted(parent.glob(prefix_path.name + ".*")))
        seen = set()
        for candidate in candidates:
            text = str(candidate)
            if text in seen:
                continue
            seen.add(text)
            if candidate.exists() and candidate.is_file():
                return candidate
        return None

    target = resolve_submission(PREFIX)
    if target is None:
        print(
            json.dumps(
                {
                    "error": "submission_not_found",
                    "problem_id": PROBLEM_ID,
                    "code_path_prefix": PREFIX,
                },
                sort_keys=True,
            )
        )
        raise SystemExit(1)

    language = infer_language(target)
    code = target.read_text()

    try:
        import ale_bench

        session = ale_bench.start(
            problem_id=PROBLEM_ID,
            lite_version=False,
            num_workers=1,
            run_visualization_server=False,
        )
        try:
            public_result = session.public_eval(code, code_language=language)
            payload = {
                "problem_id": PROBLEM_ID,
                "code_path": str(target),
                "language": language,
                "overall_judge_result": str(public_result.overall_judge_result),
                "overall_absolute_score": int(public_result.overall_absolute_score),
                "overall_relative_score": (
                    int(public_result.overall_relative_score)
                    if public_result.overall_relative_score is not None
                    else None
                ),
            }
        finally:
            session.close()
        print(json.dumps(payload, sort_keys=True))
    except Exception as exc:
        print(
            json.dumps(
                {
                    "error": "public_eval_failed",
                    "problem_id": PROBLEM_ID,
                    "code_path": str(target),
                    "language": language,
                    "exception_type": type(exc).__name__,
                    "exception_message": str(exc),
                },
                sort_keys=True,
            )
        )
        raise SystemExit(1)
    PY
  allowed_languages: "C++20 (gcc 12.2.0), Python3 (CPython 3.11.4), Rust (rustc 1.70.0)"
  allowed_cpp_libraries: "AC Library@1.5.1, Boost@1.82.0, GMP@6.2.1, Eigen@3.4.0-2ubuntu2"
  allowed_python_libraries: "numpy==1.24.1, scipy==1.10.1, networkx==3.0, sympy==1.11.1, sortedcontainers==2.4.0, more-itertools==9.0.0, shapely==2.0.0, bitarray==2.6.2, PuLP==2.7.0, mpmath==1.2.1, pandas==1.5.2, z3-solver==4.12.1.0, scikit-learn==1.2.0, ortools==9.5.2237, ac-library-python, setuptools==66.0.0, cppyy==2.4.1, torch==1.13.1+cpu, polars==0.15.15, lightgbm==3.3.1, gmpy2==2.1.5, numba==0.57.0"
  allowed_rust_libraries: "ac-library-rs@=0.1.1, once_cell@=1.18.0, static_assertions@=1.1.0, varisat@=0.2.2, memoise@=0.3.2, argio@=0.2.0, bitvec@=1.0.1, counter@=0.5.7, hashbag@=0.1.11, pathfinding@=4.3.0, recur-fn@=2.2.0, indexing@=0.4.1, amplify@=3.14.2, amplify_derive@=2.11.3, amplify_num@=0.4.1, easy-ext@=1.0.1, multimap@=0.9.0, btreemultimap@=0.1.1, bstr@=1.6.0, az@=1.2.1, glidesort@=0.1.2, tap@=1.0.1, omniswap@=0.1.0, multiversion@=0.7.2, num@=0.4.1, num-bigint@=0.4.3, num-complex@=0.4.3, num-integer@=0.1.45, num-iter@=0.1.43, num-rational@=0.4.1, num-traits@=0.2.15, num-derive@=0.4.0, ndarray@=0.15.6, nalgebra@=0.32.3, alga@=0.9.3, libm@=0.2.7, rand@=0.8.5, getrandom@=0.2.10, rand_chacha@=0.3.1, rand_core@=0.6.4, rand_hc@=0.3.2, rand_pcg@=0.3.1, rand_distr@=0.4.3, petgraph@=0.6.3, indexmap@=2.0.0, regex@=1.9.1, lazy_static@=1.4.0, ordered-float@=3.7.0, ascii@=1.1.0, permutohedron@=0.2.4, superslice@=1.0.0, itertools@=0.11.0, itertools-num@=0.1.3, maplit@=1.0.2, either@=1.8.1, im-rc@=15.1.0, fixedbitset@=0.4.2, bitset-fixed@=0.1.0, proconio@=0.4.5, text_io@=0.1.12, rustc-hash@=1.1.0, smallvec@=1.11.0"

