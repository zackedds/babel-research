[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babel-research"
version = "0.1.0"
description = "Simple tmux-backed coding agent orchestrator"
requires-python = ">=3.11"

[project.scripts]
bab = "src.bab_cli.cli:main"
tasks = "src.tasks.tasks_cli:main"
weighted-average = "src.weighted_average_cli:main"
factorial = "src.factorial_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.uv]
package = true
